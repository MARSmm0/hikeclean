appId: com.lukyan.hike
productName: Hike

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - "!**/*.map"
  - "!**/*.ts"

win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hike

portable:
  artifactName: Hike ${version}.exe