appId: com.lukyan.hike
productName: Hike
directories:
  output: release
files:
  - out/**
win:
  target: [nsis, portable]
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target: [dmg, zip]
linux:
  target: [AppImage, deb]
  category: Utility
